<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0f0f0f; color: white; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #555; border-radius: 8px; background: #222; color: white; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #ff0033; color: white; font-weight: 700; cursor: pointer; }
    .video { position: relative; margin-top: 20px; aspect-ratio: 16 / 9; background: #000; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <main>
    <h1>YouTube Viewer</h1>
    <form id="form">
      <input id="url" type="text" placeholder="Paste a YouTube link" required>
      <button type="submit">Watch</button>
    </form>
    <div class="video"><iframe id="player" title="YouTube video player" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>
  </main>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#url');
    const player = document.querySelector('#player');

    form.addEventListener('submit', (event) => {
      event.preventEvent();
      const value = input.value.trim();
      let id = '';

      try {
        const url = new URL(value);
        if (url.hostname === 'youtu.be') id = url.pathname.slice(1);
        else if (url.hostname.includes('youtube.com')) id = url.searchParams.get('v') || url.pathname.split('/').pop();
      } catch {
        id = value;
      }

      if (/^[\w-]{11}$/.test(id)) {
        player.src = `https://www.youtube.com/embed/${id}`;
      } else {
        alert('Please enter a valid YouTube URL or 11-character video ID.');
      }
    });
  </script>
</body>
</html>
